server {
    listen 8692;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom uses client-side routing, so unknown paths must
    # fall back to index.html instead of returning nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /backend/ {
        # 'backend' matches the service name in docker-compose.yml
        proxy_pass http://app-a-backend:8691/; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
