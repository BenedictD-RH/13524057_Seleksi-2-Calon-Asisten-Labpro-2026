services:
  # auth-provider-server:
  #   build: ./server
  #   ports:
  #     - "8080:8080"
  #   env_file:
  #     - ./.env
  
  auth-provider-db:
    image: mysql:8.0
    container_name: auth-provider-db
    restart: always
    environment:
      MYSQL_DATABASE: auth-provider-db
      MYSQL_ROOT_PASSWORD: ${AUTH_PROVIDER_DB_PASS}
    ports:
      - "5342:3306"
    volumes:
      - ./primary-db:/docker-entrypoint-initdb.d
      - auth-provider-db_data:/var/lib/mysql


volumes:
  auth-provider-db_data:
